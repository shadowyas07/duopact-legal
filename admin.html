<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuoPact — Modération</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A1F">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  /* Tableau de bord de modération : complète style.css (mêmes couleurs que l'app). */
  main { max-width: 1180px; }
  .topbar-inner { max-width: 1180px; }
  [hidden] { display: none !important; }
  .center { min-height: 60vh; display: grid; place-items: center; text-align: center; }
  .center .card { max-width: 420px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: 600 14px/1.2 inherit; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  .btn.primary { color: #fff; border: 0; background: linear-gradient(90deg, #6366F1, #9333EA); }
  .btn.danger { color: #FF8FA3; border-color: rgba(255, 77, 109, .45); background: rgba(255, 77, 109, .08); }
  .btn.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
  .who { color: var(--muted); font-size: 14px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 18px; }
  .tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent;
         color: var(--muted); font: 500 14px inherit; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--text); background: var(--surface); }
  .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px;
           font-size: 12px; line-height: 20px; text-align: center; color: #fff; background: #F472B6; }

  .layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { text-align: left; width: 100%; padding: 14px 16px; border-radius: 16px; cursor: pointer;
          border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
  .item:hover { border-color: color-mix(in srgb, var(--violet) 50%, transparent); }
  .item[aria-current="true"] { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet) inset; }
  .item .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .item .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
          font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.ok { color: #2EE6A6; background: rgba(46, 230, 166, .12); }
  .pill.warn { color: #FFB938; background: rgba(255, 185, 56, .12); }
  .pill.bad { color: #FF4D6D; background: rgba(255, 77, 109, .12); }
  .pill.muted { color: var(--muted); background: rgba(157, 155, 199, .12); }
  .empty { color: var(--muted); padding: 28px 8px; text-align: center; }

  .detail .card { margin-top: 0; }
  .detail h2 { margin: 0 0 6px; font-size: 20px; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 14px 0; }
  .meta-grid > div { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); }
  .meta-grid small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .meta-grid .pill { white-space: normal; margin-top: 6px; line-height: 1.35; }
  .chat { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 16px;
          border: 1px solid var(--border); max-height: 520px; overflow-y: auto; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 16px; font-size: 15px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .msg.reported { align-self: flex-start; background: rgba(255, 77, 109, .10); border: 1px solid rgba(255, 77, 109, .35); }
  .msg.reporter { align-self: flex-end; background: rgba(99, 102, 241, .16); border: 1px solid rgba(99, 102, 241, .4); }
  .msg.focus { box-shadow: 0 0 0 2px #FFB938; }
  .msg .info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px;
               font-size: 11px; color: var(--muted); }
  .msg .deleted { font-style: italic; color: var(--muted); }
  .msg .original { display: block; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  textarea { width: 100%; min-height: 70px; padding: 10px 12px; border-radius: 12px; resize: vertical;
             border: 1px solid var(--border); background: rgba(0, 0, 0, .15); color: var(--text); font: inherit; }
  .banner { padding: 12px 14px; border-radius: 12px; margin: 12px 0; font-size: 14px; }
  .banner.warn { background: rgba(255, 185, 56, .1); border: 1px solid rgba(255, 185, 56, .35); }
  .banner.ok { background: rgba(46, 230, 166, .08); border: 1px solid rgba(46, 230, 166, .3); }
  .banner.bad { background: rgba(255, 77, 109, .1); border: 1px solid rgba(255, 77, 109, .4); }
  .search { width: 100%; max-width: 480px; margin-bottom: 14px; padding: 11px 14px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
  select.tpl { margin: 8px 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
               background: var(--surface); color: var(--text); font: inherit; max-width: 100%; }
  .log-row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 10px 0;
             border-bottom: 1px solid var(--border); font-size: 14px; }
  .log-row:last-child { border-bottom: 0; }
  @media (max-width: 600px) { .log-row { grid-template-columns: 1fr; gap: 2px; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .stat { padding: 16px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
  .stat b { display: block; font-size: 28px; line-height: 1.2; }
  .stat small { color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 10px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .bar i { display: block; width: 100%; max-width: 48px; border-radius: 8px 8px 3px 3px; min-height: 3px;
           background: linear-gradient(180deg, #C084FC, #6366F1); }
  .msg .tools { margin-top: 6px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
           transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; z-index: 50;
           background: #1F1E42; color: #F3F1FF; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><img src="logo.svg" alt=""><span>DuoPact · Modération</span></a>
    <div class="nav">
      <span class="who" id="who"></span>
      <button class="btn small" id="signOut" hidden>Se déconnecter</button>
    </div>
  </div>
</header>

<main>
  <!-- Connexion -->
  <section class="center" id="loginView" hidden>
    <div class="card">
      <h2>Espace de modération</h2>
      <p class="muted">Réservé à l'éditeur de DuoPact. Connecte-toi avec ton compte Google.</p>
      <button class="btn primary" id="signIn">Se connecter avec Google</button>
      <p class="muted" id="loginError" hidden></p>
    </div>
  </section>

  <!-- Chargement -->
  <section class="center" id="loadingView"><p class="muted">Chargement…</p></section>

  <!-- Tableau de bord -->
  <section id="dashView" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="open" aria-selected="true">À traiter<span class="count" id="openCount" hidden></span></button>
      <button class="tab" role="tab" data-tab="closed">Traités</button>
      <button class="tab" role="tab" data-tab="banned">Suspensions<span class="count" id="appealCount" hidden title="Justifications à examiner"></span></button>
      <button class="tab" role="tab" data-tab="users">Utilisateurs</button>
      <button class="tab" role="tab" data-tab="log">Journal</button>
      <button class="tab" role="tab" data-tab="stats">Statistiques</button>
    </div>

    <div class="layout" id="reportsLayout">
      <div class="list" id="reportList"></div>
      <div class="detail" id="detail"><div class="card empty">Choisis un signalement.</div></div>
    </div>

    <div id="bannedView" hidden>
      <div class="list" id="bannedList"></div>
    </div>

    <div id="usersView" hidden>
      <input class="search" id="userSearch" type="search" placeholder="Rechercher un nom d'utilisateur…" autocomplete="off">
      <div class="layout">
        <div class="list" id="userList"></div>
        <div class="detail" id="userDetail"><div class="card empty">Cherche puis choisis un utilisateur.</div></div>
      </div>
    </div>

    <div id="logView" hidden>
      <div class="card"><div id="logList"></div></div>
    </div>

    <div id="statsView" hidden></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, connectAuthEmulator,
  signInWithCredential
} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {
  getFirestore, connectFirestoreEmulator, collection, doc, getDoc, getDocs, query, where,
  onSnapshot, updateDoc, setDoc, deleteDoc, serverTimestamp, Timestamp, writeBatch
} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

// Configuration publique du projet Firebase (pas un secret : la sécurité vient des règles).
const firebaseConfig = {
  apiKey: 'AIzaSyDBZ7jSktZSLXx1DzPxRJE2jPN7VjDP-vg',
  authDomain: 'focus-duo-aa16a.firebaseapp.com',
  projectId: 'focus-duo-aa16a',
};
const ADMIN_EMAIL = 'squalli.yassine.dev@gmail.com';
const params = new URLSearchParams(location.search);
const EMULATOR = params.has('emulator'); // tests locaux uniquement (émulateur sur 127.0.0.1)

const app = initializeApp(EMULATOR ? { ...firebaseConfig, projectId: 'demo-duopact' } : firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
if (EMULATOR) {
  connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectFirestoreEmulator(db, '127.0.0.1', 8080);
}

const $ = (id) => document.getElementById(id);
const show = (id) => ['loginView', 'loadingView', 'dashView'].forEach((v) => ($(v).hidden = v !== id));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const toast = (text) => { const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => (t.hidden = true), 3200); };
const ms = (v) => (v?.toMillis ? v.toMillis() : typeof v === 'number' ? v : 0);
const fmt = (v) => { const t = ms(v); return t ? new Date(t).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }) : '—'; };
const DECISIONS = { dismissed: 'Classé sans suite', ban_7d: 'Suspendu 7 jours', ban_30d: 'Suspendu 30 jours', ban_forever: 'Suspendu définitivement' };

// ---------------------------------------------------------------- noms d'utilisateurs (cache)
const names = new Map();
async function nameOf(uid) {
  if (!uid) return '?';
  if (!names.has(uid)) {
    names.set(uid, getDoc(doc(db, 'users', uid)).then((d) => d.data()?.username || uid.slice(0, 8)).catch(() => uid.slice(0, 8)));
  }
  return names.get(uid);
}

// ---------------------------------------------------------------- connexion
$('signIn').onclick = async () => {
  $('loginError').hidden = true;
  try {
    if (EMULATOR) {
      await signInWithCredential(auth, GoogleAuthProvider.credential(JSON.stringify({ sub: 'admin', email: ADMIN_EMAIL, email_verified: true })));
    } else {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ login_hint: ADMIN_EMAIL, prompt: 'select_account' });
      await signInWithPopup(auth, provider);
    }
  } catch (e) {
    $('loginError').textContent = 'Connexion impossible : ' + (e.code || e.message);
    $('loginError').hidden = false;
  }
};
$('signOut').onclick = () => signOut(auth);

let unsubscribe = [];
onAuthStateChanged(auth, (user) => {
  unsubscribe.forEach((u) => u()); unsubscribe = [];
  $('signOut').hidden = !user;
  $('who').textContent = user ? user.email : '';
  if (!user) return show('loginView');
  const isGoogle = user.providerData.some((p) => p.providerId === 'google.com');
  if (user.email !== ADMIN_EMAIL || !user.emailVerified || !isGoogle) {
    // Le serveur refuserait de toute façon : on l'explique et on déconnecte.
    $('loginError').textContent = `Le compte ${user.email || ''} n'a pas accès à la modération.`;
    $('loginError').hidden = false;
    signOut(auth);
    return;
  }
  show('dashView');
  startDashboard();
  if (EMULATOR && params.get('tab')) setTimeout(() => document.querySelector(`.tab[data-tab="${params.get('tab')}"]`)?.click(), 1500);
  if (EMULATOR && params.get('q')) setTimeout(() => {
    $('userSearch').value = params.get('q'); renderUserList(); $('userList').querySelector('.item')?.click();
  }, 3000);
  if (EMULATOR && params.get('select')) {
    const tryOpen = (n) => {
      const r = reports.find((x) => x.id === params.get('select'));
      if (r) { selected = r.id; renderList(); renderDetail(r); } else if (n > 0) setTimeout(() => tryOpen(n - 1), 500);
    };
    setTimeout(() => tryOpen(20), 1000);
  }
});
// Tests locaux : connexion automatique à l'émulateur.
if (EMULATOR && params.has('autologin')) onAuthStateChanged(auth, (u) => { if (!u) $('signIn').click(); });

// ---------------------------------------------------------------- données en direct
let reports = [];      // tous les signalements (ouverts + traités)
let banned = new Map(); // uid -> données de suspension
let appeals = new Map(); // uid -> justification de la personne suspendue
let modlog = [];         // journal de modération, le plus récent d'abord
let users = null;        // [{ uid, username }] chargés à l'ouverture de l'onglet Utilisateurs
let tab = 'open';
let selected = null;

function startDashboard() {
  unsubscribe.push(onSnapshot(collection(db, 'reports'), (snap) => {
    reports = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
    const open = reports.filter((r) => r.status === 'open').length;
    $('openCount').textContent = open; $('openCount').hidden = open === 0;
    document.title = (open ? `(${open}) ` : '') + 'DuoPact — Modération';
    renderList();
    if (selected) renderDetail(reports.find((r) => r.id === selected));
    if (tab === 'stats') renderStats();
  }, (e) => toast('Lecture refusée : ' + e.code)));
  unsubscribe.push(onSnapshot(collection(db, 'modlog'), (snap) => {
    modlog = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b.at) - ms(a.at));
    if (tab === 'log') renderLog();
  }));
  unsubscribe.push(onSnapshot(collection(db, 'appeals'), (snap) => {
    appeals = new Map(snap.docs.map((d) => [d.id, d.data()]));
    const pending = [...appeals.values()].filter((a) => a.status === 'pending').length;
    $('appealCount').textContent = pending; $('appealCount').hidden = pending === 0;
    if (tab === 'banned') renderBanned();
  }));
  unsubscribe.push(onSnapshot(collection(db, 'banned'), (snap) => {
    banned = new Map(snap.docs.map((d) => [d.id, d.data()]));
    if (tab === 'banned') renderBanned();
    if (selected) renderDetail(reports.find((r) => r.id === selected));
  }));
}

const VIEWS = { open: 'reportsLayout', closed: 'reportsLayout', banned: 'bannedView', users: 'usersView', log: 'logView', stats: 'statsView' };
document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => {
  tab = t.dataset.tab;
  document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', x === t));
  new Set(Object.values(VIEWS)).forEach((v) => ($(v).hidden = v !== VIEWS[tab]));
  selected = null;
  $('detail').replaceChildren(el('div', 'card empty', 'Choisis un signalement.'));
  if (tab === 'banned') renderBanned();
  else if (tab === 'users') loadUsers();
  else if (tab === 'log') renderLog();
  else if (tab === 'stats') renderStats();
  else renderList();
}));

/** Ouvre un signalement depuis un autre onglet (profil utilisateur, journal). */
function openReport(id) {
  const r = reports.find((x) => x.id === id);
  if (!r) return toast('Signalement introuvable.');
  document.querySelector(`.tab[data-tab="${r.status === 'open' ? 'open' : 'closed'}"]`).click();
  selected = r.id; renderList(); renderDetail(r);
}

// ---------------------------------------------------------------- journal de modération
const ACTIONS = {
  dismissed: 'Signalement classé sans suite', ban_7d: 'Suspension 7 jours', ban_30d: 'Suspension 30 jours',
  ban_forever: 'Suspension définitive', lift: 'Suspension levée', appeal_accepted: 'Justification acceptée',
  appeal_rejected: 'Justification rejetée', reopen: 'Signalement rouvert', dissolve: 'Duo dissous',
  remove_message: 'Message retiré',
};
/** Ajoute une entrée au journal (dans [batch] si fourni, pour que tout soit enregistré ensemble). */
function logAction(action, targetUid, reportId, details, batch) {
  const ref = doc(collection(db, 'modlog'));
  const data = { action, targetUid: targetUid || null, reportId: reportId || null, details: (details || '').slice(0, 1000),
    at: serverTimestamp(), by: ADMIN_EMAIL };
  return batch ? batch.set(ref, data) : setDoc(ref, data);
}

// ---------------------------------------------------------------- modèles de réponse
const TEMPLATES = {
  note: [
    'Aucune infraction aux conditions d\'utilisation.',
    'Insultes répétées envers son pote.',
    'Menaces explicites.',
    'Contenu sexuel non sollicité.',
    'Spam ou tentative d\'arnaque.',
  ],
  reply: [
    'Suspension maintenue : les messages sont explicites et contraires aux conditions d\'utilisation.',
    'Suspension maintenue : ce n\'est pas la première fois que ce comportement est signalé.',
    'Suspension levée : merci pour tes explications. Merci de respecter les conditions d\'utilisation à l\'avenir.',
    'Suspension levée : après vérification, il s\'agissait d\'un malentendu.',
  ],
};
/** Menu déroulant qui remplit [target] avec un modèle (modifiable ensuite). */
function templatePicker(kind, target) {
  const s = el('select', 'tpl');
  s.append(el('option', null, 'Utiliser un modèle…'));
  TEMPLATES[kind].forEach((t) => s.append(el('option', null, t)));
  s.onchange = () => { if (s.selectedIndex > 0) { target.value = s.value; target.focus(); } s.selectedIndex = 0; };
  return s;
}

function banState(uid) {
  const b = banned.get(uid);
  if (!b) return null;
  if (b.until && ms(b.until) < Date.now()) return null; // expirée
  return b;
}

// ---------------------------------------------------------------- liste
async function renderList() {
  if (tab === 'banned') return;
  const items = reports.filter((r) => (tab === 'open' ? r.status === 'open' : r.status !== 'open'));
  const list = $('reportList');
  if (!items.length) return list.replaceChildren(el('div', 'card empty', tab === 'open' ? 'Aucun signalement à traiter.' : 'Aucun signalement traité.'));
  const nodes = await Promise.all(items.map(async (r) => {
    const b = el('button', 'item');
    if (r.id === selected) b.setAttribute('aria-current', 'true');
    const top = el('div', 'top');
    top.append(el('span', null, r.reason || 'Signalement'));
    top.append(r.status === 'open' ? el('span', 'pill warn', 'À traiter') : el('span', 'pill muted', DECISIONS[r.decision] || 'Traité'));
    b.append(top);
    b.append(el('div', 'sub', `${await nameOf(r.reporterUid)} signale ${await nameOf(r.reportedUid)} · ${fmt(r.createdAt)}`));
    b.onclick = () => { selected = r.id; renderList(); renderDetail(r); };
    return b;
  }));
  list.replaceChildren(...nodes);
}

// ---------------------------------------------------------------- détail
async function renderDetail(r) {
  const box = $('detail');
  if (!r) return box.replaceChildren(el('div', 'card empty', 'Choisis un signalement.'));
  const [reporter, reported] = await Promise.all([nameOf(r.reporterUid), nameOf(r.reportedUid)]);
  const card = el('div', 'card');
  card.append(el('h2', null, r.reason || 'Signalement'));
  card.append(el('p', 'muted', `Référence ${r.id} · ${fmt(r.createdAt)}`));

  const grid = el('div', 'meta-grid');
  const cell = (label, value, extra) => { const d = el('div'); d.append(el('small', null, label), el('div', null, value)); if (extra) d.append(extra); return d; };
  const history = reports.filter((x) => x.reportedUid === r.reportedUid);
  const ban = banState(r.reportedUid);
  grid.append(cell('Personne signalée', reported, ban ? el('span', 'pill bad', ban.until ? `Suspendu jusqu'au ${fmt(ban.until)}` : 'Suspendu définitivement') : null));
  // Détection des signalements abusifs : combien de signalements de cette personne ont été classés sans suite.
  const sent = reports.filter((x) => x.reporterUid === r.reporterUid);
  const dismissed = sent.filter((x) => x.decision === 'dismissed').length;
  const abuse = dismissed >= 3 && dismissed / Math.max(1, sent.filter((x) => x.status !== 'open').length) >= 0.6;
  grid.append(cell('Signalé par', reporter,
    el('span', 'pill ' + (abuse ? 'bad' : dismissed ? 'warn' : 'muted'),
      abuse ? `Signalements abusifs probables : ${dismissed} sans suite sur ${sent.length}`
        : `${sent.length} signalement(s) envoyé(s), ${dismissed} sans suite`)));
  grid.append(cell('Historique', `${history.length} signalement(s) contre ${reported}`));
  card.append(grid);
  if (r.details) { card.append(el('small', 'muted', 'Précisions'), el('p', null, r.details)); }

  // Vérification de la copie avec la conversation réelle (si le duo existe encore).
  const banner = el('div', 'banner warn', 'Vérification de la conversation…');
  card.append(banner);
  const chat = el('div', 'chat');
  card.append(chat);

  // Décision
  if (r.status === 'open') {
    const note = el('textarea'); note.placeholder = 'Note sur ta décision (facultatif)';
    card.append(el('h3', null, 'Décision'), templatePicker('note', note), note);
    const actions = el('div', 'actions');
    const act = (label, cls, fn) => { const b = el('button', 'btn ' + cls, label); b.onclick = async () => {
      actions.querySelectorAll('button').forEach((x) => (x.disabled = true));
      try { await fn(note.value.trim()); toast('Décision enregistrée.'); }
      catch (e) {
        if (e.message !== 'Annulé') toast('Échec : ' + (e.code || e.message));
        actions.querySelectorAll('button').forEach((x) => (x.disabled = false));
      }
    }; actions.append(b); };
    act('Classer sans suite', '', (n) => decide(r, 'dismissed', n, null));
    act('Suspendre 7 jours', 'danger', (n) => decide(r, 'ban_7d', n, 7));
    act('Suspendre 30 jours', 'danger', (n) => decide(r, 'ban_30d', n, 30));
    act('Suspendre définitivement', 'danger', (n) => decide(r, 'ban_forever', n, Infinity));
    card.append(actions);
  } else {
    card.append(el('div', 'banner ok', `${DECISIONS[r.decision] || 'Traité'} · ${fmt(r.decidedAt)}${r.note ? ' · ' + r.note : ''}`));
    const actions = el('div', 'actions');
    const reopen = el('button', 'btn small', 'Rouvrir');
    reopen.onclick = () => {
      const b = writeBatch(db);
      b.update(doc(db, 'reports', r.id), { status: 'open' });
      logAction('reopen', r.reportedUid, r.id, '', b);
      b.commit().catch((e) => toast(e.code));
    };
    actions.append(reopen);
    if (ban) {
      const lift = el('button', 'btn small', 'Lever la suspension');
      lift.onclick = () => liftBan(r.reportedUid, r.id);
      actions.append(lift);
    }
    card.append(actions);
  }
  box.replaceChildren(card);

  // Conversation + comparaison avec l'original.
  const msgs = r.messages || [];
  if (!msgs.length) { chat.append(el('div', 'empty', 'Aucun message joint.')); }
  let same = 0, diff = 0, gone = 0;
  const pairAlive = r.pairId ? (await getDoc(doc(db, 'pairs', r.pairId)).catch(() => null))?.exists() : false;
  for (const m of msgs) {
    const fromReported = m.senderUid === r.reportedUid;
    const bubble = el('div', 'msg ' + (fromReported ? 'reported' : 'reporter') + (m.id === r.focusMessageId ? ' focus' : ''));
    // Texte d'origine conservé dans le signalement (duo déjà dissous), sinon lu dans l'archive.
    let original = (r.evidence || []).find((e) => e.id === m.id)?.original ?? null, status = 'introuvable';
    if (pairAlive && m.id) {
      const live = await getDoc(doc(db, 'pairs', r.pairId, 'messages', m.id)).catch(() => null);
      if (live?.exists()) {
        const data = live.data();
        if (data.deleted) {
          const arc = await getDoc(doc(db, 'pairs', r.pairId, 'messageArchive', m.id)).catch(() => null);
          original = arc?.data()?.text ?? null;
          status = !m.deleted || original != null ? 'conforme' : 'introuvable';
          if (!m.deleted && original != null && original !== m.text) status = 'différent';
        } else {
          status = data.text === m.text ? 'conforme' : 'différent';
        }
      }
    }
    if (status === 'conforme') same++; else if (status === 'différent') diff++; else gone++;

    if (m.deleted) {
      bubble.append(el('span', 'deleted', 'Message supprimé par son auteur'));
      if (original != null) { const o = el('span', 'original', original); bubble.append(o); }
    } else {
      bubble.append(document.createTextNode(m.text || ''));
    }
    const info = el('div', 'info');
    info.append(el('span', null, `${fromReported ? reported : reporter} · ${fmt(m.createdAt)}`));
    info.append(el('span', 'pill ' + (status === 'conforme' ? 'ok' : status === 'différent' ? 'bad' : 'muted'), status));
    if (m.id === r.focusMessageId) info.append(el('span', 'pill warn', 'Message signalé'));
    bubble.append(info);
    // Contenu grave : retrait de CE message uniquement (le duo continue).
    if (pairAlive && fromReported && !m.deleted && status === 'conforme') {
      const tools = el('div', 'tools');
      const rm = el('button', 'btn small danger', 'Retirer ce message');
      rm.onclick = () => removeMessage(r, m);
      tools.append(rm);
      bubble.append(tools);
    }
    chat.append(bubble);
  }
  chat.scrollTop = chat.scrollHeight;
  if (!pairAlive) {
    banner.className = 'banner warn';
    banner.textContent = 'Le duo n\'existe plus : la copie ne peut pas être comparée à l\'original. Elle reste la seule trace.';
  } else if (diff) {
    banner.className = 'banner bad';
    banner.textContent = `Attention : ${diff} message(s) diffèrent de la conversation réelle. La copie a peut-être été modifiée.`;
  } else {
    banner.className = 'banner ok';
    banner.textContent = `Copie vérifiée : ${same} message(s) conformes à la conversation réelle` + (gone ? `, ${gone} introuvable(s).` : '.');
  }
}

async function decide(r, decision, note, days) {
  if (days === Infinity && r.pairId) {
    const ok = confirm('Suspension définitive : le duo sera aussi dissous (le pacte prend fin pour les deux, '
      + 'la conversation est effacée ; la copie jointe au signalement est conservée). Continuer ?');
    if (!ok) throw new Error('Annulé');
  }
  // Preuve : les textes d'origine des messages supprimés sont joints au signalement avant tout effacement.
  const evidence = [];
  if (r.pairId) {
    for (const m of r.messages || []) {
      if (!m.deleted || !m.id) continue;
      const arc = await getDoc(doc(db, 'pairs', r.pairId, 'messageArchive', m.id)).catch(() => null);
      if (arc?.exists()) evidence.push({ id: m.id, original: arc.data().text });
    }
  }
  const batch = writeBatch(db);
  batch.update(doc(db, 'reports', r.id), { status: 'closed', decision, note, decidedAt: serverTimestamp(),
    ...(evidence.length ? { evidence } : {}) });
  logAction(decision, r.reportedUid, r.id, note, batch);
  if (days) {
    batch.set(doc(db, 'banned', r.reportedUid), {
      reason: (r.reason || 'Signalement') + (note ? ' — ' + note : ''),
      at: serverTimestamp(),
      until: days === Infinity ? null : Timestamp.fromMillis(Date.now() + days * 86400e3),
      reportId: r.id,
      by: ADMIN_EMAIL,
    });
  }
  await batch.commit();
  if (days === Infinity && r.pairId) await dissolvePair(r.pairId);
}

/** Suspension définitive : le duo est dissous (les deux applis le détectent et lèvent le pacte), puis effacé. */
async function dissolvePair(pairId) {
  const pairRef = doc(db, 'pairs', pairId);
  const snap = await getDoc(pairRef).catch(() => null);
  if (!snap?.exists()) return;
  if (!snap.data().dissolvedBy) await updateDoc(pairRef, { dissolvedBy: 'moderation', dissolvedAt: Date.now() });
  for (const sub of ['usage', 'selections', 'plan', 'limits', 'requests', 'messages', 'messageArchive']) {
    const docs = (await getDocs(collection(db, 'pairs', pairId, sub))).docs;
    for (let i = 0; i < docs.length; i += 10) {
      const b = writeBatch(db);
      docs.slice(i, i + 10).forEach((d) => b.delete(d.ref));
      await b.commit();
    }
  }
  await deleteDoc(pairRef);
  await logAction('dissolve', null, null, `Duo ${pairId}`);
  toast('Duo dissous.');
}

/** Lève une suspension (journalisée). [appeal] : décision sur la justification en même temps. */
async function liftBan(uid, reportId, appeal) {
  try {
    const b = writeBatch(db);
    if (appeal) b.update(doc(db, 'appeals', uid), { status: 'accepted', reply: appeal.reply || '', decidedAt: serverTimestamp() });
    b.delete(doc(db, 'banned', uid));
    logAction(appeal ? 'appeal_accepted' : 'lift', uid, reportId, appeal?.reply || '', b);
    await b.commit();
    toast('Suspension levée.');
  } catch (e) { toast('Échec : ' + (e.code || e.message)); }
}

/** Retire un message précis (contenu grave) sans dissoudre le duo ; le texte est archivé à l'identique. */
async function removeMessage(r, m) {
  if (!confirm('Retirer ce message pour les deux personnes ? Il sera remplacé par « Message retiré par la modération ». '
    + 'Le texte d\'origine reste archivé.')) return;
  try {
    const live = await getDoc(doc(db, 'pairs', r.pairId, 'messages', m.id));
    if (!live.exists() || live.data().deleted) return toast('Ce message n\'existe plus ou est déjà supprimé.');
    const b = writeBatch(db);
    b.set(doc(db, 'pairs', r.pairId, 'messageArchive', m.id), {
      senderUid: live.data().senderUid, text: live.data().text, createdAt: live.data().createdAt ?? 0,
      deletedAt: serverTimestamp(), deletedBy: 'moderation',
    });
    b.update(doc(db, 'pairs', r.pairId, 'messages', m.id), { text: '', deleted: true, deletedAt: serverTimestamp(), deletedBy: 'moderation' });
    logAction('remove_message', live.data().senderUid, r.id, live.data().text, b);
    await b.commit();
    toast('Message retiré.');
    renderDetail(reports.find((x) => x.id === r.id));
  } catch (e) { toast('Échec : ' + (e.code || e.message)); }
}

// ---------------------------------------------------------------- suspensions
async function renderBanned() {
  const list = $('bannedList');
  const entries = [...banned.entries()];
  if (!entries.length) return list.replaceChildren(el('div', 'card empty', 'Aucune suspension.'));
  const nodes = await Promise.all(entries.map(async ([uid, b]) => {
    const card = el('div', 'card');
    const expired = b.until && ms(b.until) < Date.now();
    const top = el('div', 'item top'); top.style.cursor = 'default';
    card.append(el('h2', null, await nameOf(uid)));
    card.append(el('p', null, b.reason || ''));
    card.append(el('span', 'pill ' + (expired ? 'muted' : 'bad'),
      expired ? `Expirée depuis le ${fmt(b.until)}` : b.until ? `Jusqu'au ${fmt(b.until)}` : 'Définitive'));
    card.append(el('p', 'muted', `Depuis le ${fmt(b.at)}${b.reportId ? ' · signalement ' + b.reportId : ''}`));

    // Justification de la personne suspendue (une par suspension).
    const ap = appeals.get(uid);
    const apCurrent = ap && ms(ap.banAt) === ms(b.at);
    let reply = null;
    if (apCurrent) {
      const box = el('div', 'banner ' + (ap.status === 'pending' ? 'warn' : ap.status === 'accepted' ? 'ok' : 'bad'));
      box.append(el('strong', null, ap.status === 'pending' ? 'Justification à examiner' : ap.status === 'accepted' ? 'Justification acceptée' : 'Justification rejetée'));
      box.append(el('p', null, ap.text || ''));
      box.append(el('small', 'muted', `Envoyée le ${fmt(ap.createdAt)}`));
      if (ap.reply) box.append(el('p', 'muted', 'Ta réponse : ' + ap.reply));
      card.append(box);
      if (ap.status === 'pending') {
        reply = el('textarea');
        reply.placeholder = 'Réponse affichée dans son application (facultatif)';
        card.append(templatePicker('reply', reply), reply);
      }
    }

    const actions = el('div', 'actions');
    const lift = el('button', 'btn small' + (apCurrent && ap.status === 'pending' ? ' primary' : ''),
      expired ? 'Effacer' : apCurrent && ap.status === 'pending' ? 'Accepter et lever la suspension' : 'Lever la suspension');
    lift.onclick = () => liftBan(uid, b.reportId,
      apCurrent && ap.status === 'pending' ? { reply: reply?.value.trim() || '' } : null);
    actions.append(lift);
    if (apCurrent && ap.status === 'pending') {
      const reject = el('button', 'btn small danger', 'Rejeter et maintenir');
      reject.onclick = () => {
        const text = reply?.value.trim() || '';
        const batch = writeBatch(db);
        batch.update(doc(db, 'appeals', uid), { status: 'rejected', reply: text, decidedAt: serverTimestamp() });
        logAction('appeal_rejected', uid, b.reportId, text, batch);
        batch.commit().then(() => toast('Justification rejetée.')).catch((e) => toast('Échec : ' + e.code));
      };
      actions.append(reject);
    }
    card.append(actions);
    return card;
  }));
  list.replaceChildren(...nodes);
}

// ---------------------------------------------------------------- utilisateurs
async function loadUsers() {
  if (!users) {
    $('userList').replaceChildren(el('div', 'empty', 'Chargement…'));
    try {
      users = (await getDocs(collection(db, 'users'))).docs.map((d) => ({ uid: d.id, username: d.data().username || d.id }));
      users.forEach((u) => names.set(u.uid, Promise.resolve(u.username)));
    } catch (e) { users = null; return $('userList').replaceChildren(el('div', 'empty', 'Lecture refusée : ' + e.code)); }
  }
  renderUserList();
}

$('userSearch').oninput = () => renderUserList();

function renderUserList() {
  const q = $('userSearch').value.trim().toLowerCase();
  const list = $('userList');
  if (!users) return;
  if (!q) return list.replaceChildren(el('div', 'empty', `${users.length} utilisateur(s). Tape un nom pour chercher.`));
  const found = users.filter((u) => u.username.toLowerCase().includes(q) || u.uid.startsWith(q)).slice(0, 30);
  if (!found.length) return list.replaceChildren(el('div', 'empty', 'Aucun utilisateur trouvé.'));
  list.replaceChildren(...found.map((u) => {
    const b = el('button', 'item');
    const top = el('div', 'top');
    top.append(el('span', null, u.username));
    const received = reports.filter((r) => r.reportedUid === u.uid).length;
    if (banState(u.uid)) top.append(el('span', 'pill bad', 'Suspendu'));
    else if (received) top.append(el('span', 'pill warn', `${received} signalement(s)`));
    b.append(top);
    b.append(el('div', 'sub', u.uid));
    b.onclick = () => renderUser(u);
    return b;
  }));
}

async function renderUser(u) {
  const box = $('userDetail');
  const card = el('div', 'card');
  card.append(el('h2', null, u.username));
  card.append(el('p', 'muted', 'Identifiant : ' + u.uid));
  const received = reports.filter((r) => r.reportedUid === u.uid);
  const sent = reports.filter((r) => r.reporterUid === u.uid);
  const sentDismissed = sent.filter((r) => r.decision === 'dismissed').length;
  const ban = banState(u.uid);
  const grid = el('div', 'meta-grid');
  const cell = (label, value, extra) => { const d = el('div'); d.append(el('small', null, label), el('div', null, value)); if (extra) d.append(extra); return d; };
  grid.append(cell('Statut', ban ? (ban.until ? `Suspendu jusqu'au ${fmt(ban.until)}` : 'Suspendu définitivement') : 'Actif',
    el('span', 'pill ' + (ban ? 'bad' : 'ok'), ban ? 'Suspendu' : 'Aucune sanction en cours')));
  grid.append(cell('Signalements reçus', String(received.length)));
  grid.append(cell('Signalements envoyés', `${sent.length} (${sentDismissed} sans suite)`,
    sentDismissed >= 3 ? el('span', 'pill bad', 'Signalements abusifs probables') : null));
  const duoCell = cell('Duo actuel', 'Recherche…');
  grid.append(duoCell);
  card.append(grid);

  const listFor = (title, items) => {
    card.append(el('h3', null, title));
    if (!items.length) return card.append(el('p', 'muted', 'Aucun.'));
    const l = el('div', 'list');
    items.forEach((r) => {
      const b = el('button', 'item');
      const top = el('div', 'top');
      top.append(el('span', null, r.reason || 'Signalement'));
      top.append(r.status === 'open' ? el('span', 'pill warn', 'À traiter') : el('span', 'pill muted', DECISIONS[r.decision] || 'Traité'));
      b.append(top, el('div', 'sub', fmt(r.createdAt)));
      b.onclick = () => openReport(r.id);
      l.append(b);
    });
    card.append(l);
  };
  listFor('Signalements reçus', received);
  listFor('Signalements envoyés', sent);

  const history = modlog.filter((x) => x.targetUid === u.uid);
  card.append(el('h3', null, 'Historique de modération'));
  if (!history.length) card.append(el('p', 'muted', 'Aucune décision.'));
  history.forEach((x) => card.append(logRow(x)));

  if (ban) {
    const actions = el('div', 'actions');
    const lift = el('button', 'btn small', 'Lever la suspension');
    lift.onclick = () => liftBan(u.uid, ban.reportId).then(() => renderUser(u));
    actions.append(lift);
    card.append(actions);
  }
  box.replaceChildren(card);

  try {
    const pairs = await getDocs(query(collection(db, 'pairs'), where('members', 'array-contains', u.uid)));
    const p = pairs.docs.find((d) => !d.data().dissolvedBy);
    if (!p) duoCell.lastChild.textContent = 'Aucun';
    else {
      const other = (p.data().members || []).find((m) => m !== u.uid);
      duoCell.lastChild.textContent = `Avec ${await nameOf(other)} depuis le ${fmt(p.data().createdAt)}`;
    }
  } catch (e) { duoCell.lastChild.textContent = 'Indisponible (' + e.code + ')'; }
}

// ---------------------------------------------------------------- journal
function logRow(x) {
  const row = el('div', 'log-row');
  row.append(el('div', 'muted', fmt(x.at)));
  const what = el('div');
  what.append(el('strong', null, ACTIONS[x.action] || x.action));
  if (x.targetUid) {
    const who = el('span', null, ' · …');
    nameOf(x.targetUid).then((n) => (who.textContent = ' · ' + n));
    what.append(who);
  }
  if (x.details) what.append(el('div', 'muted', x.details));
  if (x.reportId) {
    const link = el('button', 'btn small', 'Voir le signalement');
    link.style.marginTop = '6px';
    link.onclick = () => openReport(x.reportId);
    what.append(el('div')); what.lastChild.append(link);
  }
  row.append(what);
  return row;
}

function renderLog() {
  const list = $('logList');
  if (!modlog.length) return list.replaceChildren(el('div', 'empty', 'Aucune décision enregistrée pour l\'instant.'));
  list.replaceChildren(el('p', 'muted', 'Chaque décision est enregistrée à l\'heure du serveur et ne peut être ni modifiée ni effacée.'),
    ...modlog.slice(0, 200).map(logRow));
}

// ---------------------------------------------------------------- statistiques
function renderStats() {
  const week = 7 * 86400e3;
  const now = Date.now();
  const closed = reports.filter((r) => r.status !== 'open' && ms(r.decidedAt) && ms(r.createdAt));
  const delays = closed.map((r) => ms(r.decidedAt) - ms(r.createdAt)).filter((d) => d >= 0);
  const avg = delays.length ? delays.reduce((a, b) => a + b, 0) / delays.length : 0;
  const human = (d) => d < 3600e3 ? `${Math.round(d / 60e3)} min` : d < 86400e3 ? `${(d / 3600e3).toFixed(1)} h` : `${(d / 86400e3).toFixed(1)} j`;
  const activeBans = [...banned.keys()].filter((uid) => banState(uid)).length;
  const dismissedRate = closed.length ? Math.round(100 * closed.filter((r) => r.decision === 'dismissed').length / closed.length) : 0;

  const stats = el('div', 'stats');
  const stat = (value, label) => { const s = el('div', 'stat'); s.append(el('b', null, value), el('small', null, label)); return s; };
  stats.append(
    stat(String(reports.filter((r) => r.status === 'open').length), 'signalements à traiter'),
    stat(delays.length ? human(avg) : '—', 'délai moyen de traitement'),
    stat(String(activeBans), 'suspensions en cours'),
    stat(closed.length ? dismissedRate + ' %' : '—', 'classés sans suite'),
    stat(String([...appeals.values()].filter((a) => a.status === 'pending').length), 'justifications à examiner'),
  );

  // Signalements par semaine (8 dernières semaines).
  const counts = Array.from({ length: 8 }, (_, i) => {
    const end = now - i * week, start = end - week;
    return reports.filter((r) => ms(r.createdAt) >= start && ms(r.createdAt) < end).length;
  }).reverse();
  const max = Math.max(1, ...counts);
  const chart = el('div', 'card');
  chart.append(el('h2', null, 'Signalements par semaine'));
  const bars = el('div', 'bars');
  bars.setAttribute('role', 'img');
  bars.setAttribute('aria-label', 'Signalements des 8 dernières semaines : ' + counts.join(', '));
  counts.forEach((c, i) => {
    const b = el('div', 'bar');
    b.append(el('span', null, String(c)));
    const bar = el('i'); bar.style.height = `${(c / max) * 120}px`;
    b.append(bar, el('span', null, i === 7 ? 'cette sem.' : `S-${7 - i}`));
    bars.append(b);
  });
  chart.append(bars);
  $('statsView').replaceChildren(stats, chart);
}
